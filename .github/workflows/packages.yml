name: packages

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests
        run: make test
      - name: POSIX syntax
        run: sh -n src/pura

  deb:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts
          dpkg-buildpackage -us -uc -b
      - uses: actions/upload-artifact@v4
        with:
          name: pura-deb
          path: ../*.deb

  source:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build source tarball
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: pura-source
          path: dist/*.tar.gz
